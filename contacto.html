    <!-- ENCABEZADO -->
    <header class="page-header">
        <h1>Contacto</h1>
        <p>Escríbenos y conoce más sobre Minuta Fresh.</p>
    </header>

    <!-- FORMULARIO -->
    <main class="content-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="contact-card">

                        <div class="text-center mb-4">
                            <i class="fa-solid fa-envelope-open-text contact-icon"></i>
                            <h2>Envíanos un mensaje</h2>
                            <p>Completa el formulario y nos pondremos en contacto contigo.</p>
                        </div>

                        <form id="contactForm">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       name="nombre"
                                       placeholder="Escribe tu nombre"
                                       maxlength="100"
                                       autocomplete="name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="ejemplo@gmail.com"
                                       maxlength="200"
                                       autocomplete="email"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea class="form-control"
                                          id="mensaje"
                                          name="mensaje"
                                          rows="6"
                                          maxlength="1000"
                                          placeholder="Escribe tu mensaje..."
                                          required></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn-minuta" id="btnEnviar">
                                    <i class="fa-solid fa-paper-plane"></i>
                                    Enviar mensaje
                                </button>
                            </div>

                            <div id="contactResult"
                                 class="alert mt-4"
                                 role="status"
                                 aria-live="polite"
                                 style="display:none;"></div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <div class="container text-center">
            <p>Minuta Fresh · Contacto</p>
        </div>
    </footer>

    <!-- LIBRERÍAS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- FUNCIONAMIENTO DEL FORMULARIO -->
    <script>
        const EMAILJS_SERVICE_ID = "service_wnynuae";
        const EMAILJS_TEMPLATE_ID = "template_gtdt91j";
        const EMAILJS_PUBLIC_KEY = "-u2vZ0g-u_8Gl7OkT";

        // Usa un webhook nuevo de Discord.
        // Este valor será visible en el JavaScript público.
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1562811350768681052/siBFFclWHrurqiNqgkH5Dzw5peG0QhPN-TDP_0K1f7SgMrtuQr00YSfZc_xe5TRxwFPi";

        emailjs.init({
            publicKey: EMAILJS_PUBLIC_KEY
        });

        $(function () {
            $("#contactForm").on("submit", async function (evento) {
                evento.preventDefault();

                const nombre = $("#nombre").val().trim();
                const email = $("#email").val().trim();
                const mensaje = $("#mensaje").val().trim();

                const boton = $("#btnEnviar");
                const resultado = $("#contactResult");

                function mostrarResultado(texto, tipo) {
                    resultado
                        .removeClass("alert-danger alert-success alert-info")
                        .addClass(tipo)
                        .text(texto)
                        .stop(true, true)
                        .fadeIn();
                }

                if (!nombre || !email || !mensaje) {
                    mostrarResultado(
                        "Completa todos los campos.",
                        "alert-danger"
                    );
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    mostrarResultado(
                        "Escribe un correo electrónico válido.",
                        "alert-danger"
                    );
                    return;
                }

                if (
                    EMAILJS_SERVICE_ID === "TU_SERVICE_ID" ||
                    EMAILJS_TEMPLATE_ID === "TU_TEMPLATE_ID" ||
                    EMAILJS_PUBLIC_KEY === "TU_PUBLIC_KEY" ||
                    DISCORD_WEBHOOK_URL === "TU_WEBHOOK_NUEVO"
                ) {
                    mostrarResultado(
                        "Falta configurar EmailJS y Discord antes de enviar.",
                        "alert-danger"
                    );
                    return;
                }

                boton.prop("disabled", true);
                mostrarResultado("Enviando mensaje...", "alert-info");

                let correoEnviado = false;

                try {
                    // ENVÍO A GMAIL MEDIANTE EMAILJS
                    await emailjs.send(
                        EMAILJS_SERVICE_ID,
                        EMAILJS_TEMPLATE_ID,
                        {
                            nombre: nombre,
                            email: email,
                            mensaje: mensaje
                        }
                    );

                    correoEnviado = true;

                    // ENVÍO A DISCORD
                    const respuestaDiscord = await fetch(
                        DISCORD_WEBHOOK_URL,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                username: "Minuta Fresh",
                                allowed_mentions: {
                                    parse: []
                                },
                                embeds: [{
                                    title: "Nuevo mensaje de contacto",
                                    color: 6716746,
                                    fields: [
                                        {
                                            name: "Nombre",
                                            value: nombre
                                        },
                                        {
                                            name: "Correo",
                                            value: email
                                        },
                                        {
                                            name: "Mensaje",
                                            value: mensaje
                                        }
                                    ],
                                    footer: {
                                        text: "Minuta Fresh"
                                    }
                                }]
                            })
                        }
                    );

                    if (!respuestaDiscord.ok) {
                        throw new Error("Discord no recibió el mensaje.");
                    }

                    mostrarResultado(
                        "¡Mensaje enviado correctamente a Gmail y Discord!",
                        "alert-success"
                    );

                    $("#contactForm")[0].reset();

                } catch (error) {
                    console.error("Error de envío:", error);

                    if (correoEnviado) {
                        mostrarResultado(
                            "El correo se envió, pero falló el envío a Discord.",
                            "alert-danger"
                        );
                    } else {
                        mostrarResultado(
                            "No se pudo enviar el mensaje. Revisa la configuración de EmailJS.",
                            "alert-danger"
                        );
                    }

                } finally {
                    boton.prop("disabled", false);
                }
            });
        });
    </script>

    <!-- SCRIPT GENERAL DEL SITIO -->
    <script src="script.js"></script>

</body>
</html>
